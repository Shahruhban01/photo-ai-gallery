version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: photo-ai-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=photo-ai-gallery
    networks:
      - photo-ai-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photo-ai-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/photo-ai-gallery
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=7d
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - photo-ai-network
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: photo-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - photo-ai-network
    command: npm start

  # ML Service (Python)
  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: photo-ai-ml
    ports:
      - "5001:5001"
    volumes:
      - ./ml:/app
      - uploads_data:/app/uploads:ro
    networks:
      - photo-ai-network

networks:
  photo-ai-network:
    driver: bridge

volumes:
  mongodb_data:
  uploads_data:
